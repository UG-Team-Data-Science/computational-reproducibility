name: Deploy Quarto slides to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26

      - name: Render and assemble slides
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public

          cd docs/quarto
          quarto render slides.qmd --to revealjs --output slides.html
          quarto render slides-november-2026.qmd --to revealjs --output slides-november-2026.html

          cp slides.html ../../public/index.html
          cp slides-november-2026.html ../../public/slides-november-2026.html
          cp -r slides_files ../../public/slides_files 2>/dev/null || true
          cp -r slides-november-2026_files ../../public/slides-november-2026_files 2>/dev/null || true
          cp -r site_libs ../../public/site_libs 2>/dev/null || true
          cp -r images ../../public/images
          cd ../../
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
