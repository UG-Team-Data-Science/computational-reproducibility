pages:
  stage: deploy
  image: python:3.11
  tags:
    - docker
  needs: []
  before_script:
   # Install Quarto without root privileges
  - curl -LO https://github.com/quarto-dev/quarto-cli/releases/download/v1.8.26/quarto-1.8.26-linux-amd64.tar.gz
  - mkdir -p "$CI_PROJECT_DIR/.quarto"
  - tar -xzf quarto-1.8.26-linux-amd64.tar.gz -C "$CI_PROJECT_DIR/.quarto"
  - export PATH="$CI_PROJECT_DIR/.quarto/quarto-1.8.26/bin:$PATH"
  - quarto --version
  - rm -f quarto-1.8.26-linux-amd64.tar.gz
  script:
    # Build reveal.js slides in docs/
    # - pip install --no-cache-dir sphinx sphinx-revealjs esbonio
      # - rm -rf public
      # - make -C docs revealjs
    - rm -rf public
    - mkdir -p public
    # Build Quarto slides with explicit output filenames
   
    - cd docs/quarto
    - quarto render slides.qmd --to revealjs --output slides.html
    - quarto render slides-november-2026.qmd --to revealjs --output slides-november-2026.html

    # Publish presentations
    - cp slides.html ../../public/index.html
    - cp slides-november-2026.html ../../public/slides-november-2026.html

    # Copy supporting resources
    - cp -r slides_files ../../public/slides_files 2>/dev/null || true
    - cp -r slides-november-2026_files ../../public/slides-november-2026_files 2>/dev/null || true
    - cp -r site_libs ../../public/site_libs 2>/dev/null || true
    - cp -r images ../../public/images

    - cd ../../

    # Inspect generated website
    - ls -R public


  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'